<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#6dd5ed,#2193b0,#cc2b5e,#753a88);
            background-size:400% 400%;
            animation:bgAnimation 10s ease infinite;
            padding:30px;
        }

        @keyframes bgAnimation{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .container{
            width:650px;
            margin:auto;
            background:white;
            border-radius:20px;
            padding:25px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#1e3c72;
            margin-bottom:20px;
        }

        table{
            width:100%;
        }

        td{
            padding:10px;
            font-weight:bold;
            color:#333;
        }

        input[type=text],
        input[type=date],
        textarea,
        select{
            width:100%;
            padding:10px;
            border:2px solid #6a11cb;
            border-radius:10px;
            outline:none;
            transition:0.3s;
            font-size:15px;
        }

        input:focus,
        textarea:focus,
        select:focus{
            border-color:#ff512f;
            box-shadow:0 0 10px #ffb347;
        }

        textarea{
            resize:none;
            height:70px;
        }

        input[type=radio]{
            width:auto;
            accent-color:#2193b0;
            margin-right:5px;
        }

        .buttons{
            text-align:center;
        }

        button{
            padding:12px 30px;
            margin:10px;
            border:none;
            border-radius:30px;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button[type=submit]{
            background:linear-gradient(to right,#00b09b,#96c93d);
        }

        button[type=reset]{
            background:linear-gradient(to right,#ff416c,#ff4b2b);
        }

        button:hover{
            transform:scale(1.05);
        }

        #message{
            text-align:center;
            color:green;
            font-size:22px;
            font-weight:bold;
            margin-top:20px;
        }
    </style>

    <script>
        function validateForm(){

            let fname=document.getElementById("fname").value.trim();
            let lname=document.getElementById("lname").value.trim();
            let roll=document.getElementById("roll").value.trim();
            let branch=document.getElementById("branch").value.trim();
            let email=document.getElementById("email").value.trim();
            let mobile=document.getElementById("mobile").value.trim();
            let dob=document.getElementById("dob").value;
            let address=document.getElementById("address").value.trim();

            let nameRegex=/^[A-Za-z ]+$/;
            let rollRegex=/^[A-Za-z0-9]{10}$/;
            let emailRegex=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
            let mobileRegex=/^[0-9]{10}$/;

            if(fname==""){
                alert("Enter First Name");
                return false;
            }

            if(!nameRegex.test(fname)){
                alert("First Name should contain only alphabets");
                return false;
            }

            if(lname==""){
                alert("Enter Last Name");
                return false;
            }

            if(!nameRegex.test(lname)){
                alert("Last Name should contain only alphabets");
                return false;
            }

            if(!rollRegex.test(roll)){
                alert("Roll Number should contain exactly 10 alphanumeric characters");
                return false;
            }

            if(branch==""){
                alert("Enter Branch");
                return false;
            }

            if(!nameRegex.test(branch)){
                alert("Branch should contain only alphabets");
                return false;
            }

            if(!emailRegex.test(email)){
                alert("Enter a valid Email");
                return false;
            }

            if(!mobileRegex.test(mobile)){
                alert("Mobile Number should contain exactly 10 digits");
                return false;
            }

            if(dob==""){
                alert("Select Date of Birth");
                return false;
            }

            let gender=document.querySelector('input[name="gender"]:checked');

            if(gender==null){
                alert("Select Gender");
                return false;
            }

            if(address==""){
                alert("Enter Address");
                return false;
            }

            document.getElementById("message").innerHTML="🎉 Thank You For Registration!";
            return false;
        }

        function clearMessage(){
            document.getElementById("message").innerHTML="";
        }
    </script>

</head>

<body>

<div class="container">

<h2>🎓 Student Registration Formrm</h2>

<form onsubmit="return validateForm()" onreset="clearMessage()">

<div class="input-box">
<label for="alternatephNo">Alternate Phone Number</label>
<input type="text" id="phNo" name="phNo" pattern="\d{10}"</input>
</div>

<table>

<tr>
<td>First Name</td>
<td><input type="text" id="fname"></td>
</tr>

<tr>
<td>Last Name</td>
<td><input type="text" id="lname"></td>
</tr>

<tr>
<td>Roll Number</td>
<td><input type="text" id="roll" maxlength="10"></td>
</tr>

<tr>
<td>Branch</td>
<td><input type="text" id="branch"></td>
</tr>

<tr>
<td>Email</td>
<td><input type="text" id="email"></td>
</tr>

<tr>
<td>Mobile Number</td>
<td><input type="text" id="mobile" maxlength="10"></td>
</tr>

<tr>
<td>Date of Birth</td>
<td><input type="date" id="dob"></td>
</tr>

<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td>Address</td>
<td><textarea id="address"></textarea></td>
</tr>

<tr>
<td>Course</td>
<td>
<select>
<option value="">--Select Course--</option>
<option>B.Tech</option>
<option>B.Sc</option>
<option>B.Com</option>
<option>M.Tech</option>
<option>MBA</option>
</select>
</td>
</tr>

<tr>
<td>Semester</td>
<td>
<select>
<option value="">--Select Semester--</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" class="buttons">
<button type="submit">Submit</button>
<button type="reset">Reset</button>
</td>
</tr>

</table>

</form>

<div id="message"></div>

</div>

</body>
</html>
